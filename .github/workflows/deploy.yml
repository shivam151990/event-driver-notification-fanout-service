name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: Existing DigitalOcean App Platform app ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify before deployment
        run: sh ./mvnw -B -ntp verify
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Rebuild and deploy configured main branch
        env:
          APP_ID: ${{ inputs.app_id }}
        run: doctl apps create-deployment "$APP_ID" --force-rebuild --wait
