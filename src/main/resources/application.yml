server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    connection-timeout: 10s
spring:
  application:
    name: notification-fanout
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fanout}
    username: ${DB_USERNAME:fanout}
    password: ${DB_PASSWORD:fanout}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 5000
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      use-big-decimal-for-floats: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
    consumer:
      group-id: fanout-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 25
    listener:
      ack-mode: record
      missing-topics-fatal: true
  task:
    scheduling:
      pool:
        size: 3
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: notification-fanout
fanout:
  api-key: ${FANOUT_API_KEY:}
  broker:
    enabled: ${FANOUT_BROKER_ENABLED:true}
    topic: ${FANOUT_BROKER_TOPIC:fanout.events.v1}
    poll-delay-ms: 500
    batch-size: 50
  delivery:
    enabled: ${FANOUT_DELIVERY_ENABLED:true}
    allow-http: ${FANOUT_DELIVERY_ALLOW_HTTP:false}
    allow-private-addresses: ${FANOUT_DELIVERY_ALLOW_PRIVATE_ADDRESSES:false}
